{# templates/chat/modals/modal_move_conv.html #}
<div class="na-modal" id="modal-move-conv" role="dialog" aria-modal="true" aria-labelledby="modal-move-conv-title">
  <div class="na-modal__backdrop"></div>
  <div class="na-modal__box">
    <div class="na-modal__header">
      <span class="na-modal__icon"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
      <h2 class="na-modal__title" id="modal-move-conv-title">Move Conversation</h2>
      <button class="na-modal__close" data-dismiss="modal-move-conv" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="na-modal__body">
      <p class="na-modal__label">Move <em id="move-conv-name-display"></em> to:</p>
      <div class="na-modal__folder-list" id="move-folder-options">
        {# Populated dynamically by JS from current DOM state #}
      </div>
    </div>
    <div class="na-modal__footer">
      <button class="na-modal__btn na-modal__btn--ghost" data-dismiss="modal-move-conv">Cancel</button>
    </div>
  </div>
</div>
