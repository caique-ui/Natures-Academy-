<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nature's Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/chat/styles.css" />
  <link rel="stylesheet" href="/static/chat/modals.css" />
  <link rel="shortcut icon" href="/static/images/favicon.ico" type="image/x-icon">
  <link href="/static/fontawesome/css/fontawesome.css" rel="stylesheet" />
  <link href="/static/fontawesome/css/brands.css" rel="stylesheet" />
  <link href="/static/fontawesome/css/solid.css" rel="stylesheet" />
  <link href="/static/fontawesome/css/sharp-thin.css" rel="stylesheet" />
  <link href="/static/fontawesome/css/sharp-duotone-thin.css" rel="stylesheet" />
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    {% block topbar_toggle %}{% endblock %}
    <div class="brand">Nature's Academy</div>
  </div>
  <!-- <form action="{% url 'reset_chat' %}" method="post">{% csrf_token %}
    <button class="btn secondary" title="Clear Conversation">CLEAR Conversation</button>
  </form> -->
  {% block topbar_actions %}{% endblock %}
</header>
<main class="main-content">
  {% block content %}{% endblock %}
</main>

{# jQuery — loaded once at base level, available to all pages #}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
